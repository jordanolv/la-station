name: 🚀 Deploy PROD to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/vps_key \
              -p ${{ secrets.VPS_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e

            PROJECT_DIR=~/projects/theridge-bot/prod
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            if [ ! -d ".git" ]; then
              git clone -b main https://${{ secrets.GH_TOKEN }}@github.com/jordanolv/the-ridge.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            npm ci
            npm run build

            APP_ENV=prod pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save

            echo "✅ PROD déployé"
          EOF
